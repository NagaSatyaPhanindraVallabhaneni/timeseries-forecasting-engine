[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-forecasting-engine"
version = "0.1.0"
description = "Deep-learning time-series forecasting: LSTM + Transformer forecasters, walk-forward backtesting, FastAPI serving (portfolio project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
